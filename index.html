            <div class="col-md-6 offset-md-3 mt-3">
                <form id="postForm">

                        <div class="card-header bg-info text-white text-center">
                            <h2>Post Details</h2>
                        </div>
                        <div class="card-body">
                            <div class="form-group">
                                <label for="postTitle">Post Title</label>
                                <input required type="text" id="postTitle" class="form-control">
                            </div>
                            <div class="form-group">
                                <label for="postDescription">Post Description</label>
                                <textarea required id="postDescription" class="form-control" rows="3"></textarea>
                            </div>
                        </div>
                        <div class="card-footer">
                            <button class="btn btn-info btn-block" id="createPostBtn">Create Post</button>
                            <button type="button" class="btn btn-dark btn-block d-none"
                                id="updatePostBtn">Update
                                Post</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
